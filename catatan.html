<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catatan — NANZZ_HUB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B0D10; --surface:#14181C; --surface-2:#1B2126;
    --line-soft: rgba(231,233,228,0.08);
    --text:#E7E9E4; --text-dim:#7C848B; --accent:#E8A33D;
    --mono:'JetBrains Mono', monospace;
  }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; -khtml-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; }
  body{
    background:var(--ink); color:var(--text); font-family:var(--mono); min-height:100vh;
    background-image:linear-gradient(var(--line-soft) 1px, transparent 1px), linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
    background-size:36px 36px;
  }
  a{ color:inherit; text-decoration:none; }
  .wrap{ max-width:760px; margin:0 auto; padding:2.4rem 1.4rem 4rem; }
  .back{ font-size:.75rem; color:var(--text-dim); display:inline-flex; align-items:center; gap:.4rem; }
  .back svg{ width:13px; height:13px; }
  .back:hover{ color:var(--accent); }
  .reveal{ opacity:0; transform:translateY(12px); transition:opacity .5s ease, transform .5s ease; }
  .reveal.is-in{ opacity:1; transform:translateY(0); }

  header{ margin:1.6rem 0 2.2rem; }
  .crumb{ font-size:.7rem; color:var(--accent); letter-spacing:.05em; margin-bottom:.5rem; }
  h1{ font-size:1.9rem; font-weight:700; }
  header p{ margin-top:.5rem; color:var(--text-dim); font-size:.82rem; }

  .panel{ background:var(--surface); border:1px solid var(--line-soft); padding:1.4rem; }

  textarea{
    width:100%; min-height:90px; resize:vertical;
    background:var(--surface-2); border:1px solid var(--line-soft); color:var(--text);
    font-family:var(--mono); font-size:.88rem; padding:.8rem; outline:none;
  }
  textarea:focus{ border-color:var(--accent); }

  .row{ display:flex; justify-content:flex-end; margin-top:.8rem; }
  .btn{
    border:1px solid var(--accent); color:var(--accent); background:transparent;
    font-family:var(--mono); font-size:.75rem; font-weight:700; letter-spacing:.03em;
    padding:.55rem 1rem; cursor:pointer; transition:.2s;
  }
  .btn:hover{ background:var(--accent); color:var(--ink); }

  .list{ margin-top:1.6rem; display:flex; flex-direction:column; gap:.8rem; }
  .note{
    background:var(--surface); border:1px solid var(--line-soft);
    padding:1rem 1.1rem; position:relative;
  }
  .note time{ display:block; font-size:.65rem; color:var(--text-dim); margin-bottom:.4rem; }
  .note p{ font-size:.86rem; white-space:pre-wrap; line-height:1.55; padding-right:1.6rem; }
  .note .del{
    position:absolute; top:.7rem; right:.8rem; cursor:pointer;
    color:var(--text-dim); font-size:.8rem; background:none; border:none; font-family:var(--mono);
  }
  .note .del:hover{ color:var(--accent); }

  .empty{ color:var(--text-dim); font-size:.8rem; text-align:center; padding:2rem 0; }

  .notice{ margin-top:1.2rem; font-size:.68rem; color:var(--text-dim); }
  .notice.warn{ color:#E8683D; }
</style>
</head>
<body>
<div class="wrap">
  <a href="index.html" class="back reveal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>Kembali</a>

  <header class="reveal">
    <div class="crumb">MODUL [ 01 ]</div>
    <h1>CATATAN</h1>
    <p>Tulis catatan singkat, checklist, atau ide. Tersimpan selama tab ini terbuka.</p>
  </header>

  <div class="panel reveal">
    <textarea id="input" placeholder="Tulis catatan di sini..."></textarea>
    <div class="row">
      <button class="btn" id="addBtn">TAMBAH CATATAN</button>
    </div>
  </div>

  <div class="list reveal" id="list"></div>
  <p class="notice" id="storageNotice">Catatan disimpan di browser ini (localStorage) dan tetap ada saat halaman dimuat ulang.</p>
</div>

<script>
(function(){
  document.querySelectorAll('.reveal').forEach(function(el,i){
    setTimeout(function(){ el.classList.add('is-in'); }, 80 + i*70);
  });

  var STORAGE_KEY = 'nanzz_hub_notes';
  var notes = [];
  var listEl = document.getElementById('list');
  var input = document.getElementById('input');
  var addBtn = document.getElementById('addBtn');
  var storageNotice = document.getElementById('storageNotice');
  var storageAvailable = (function(){
    try{
      var testKey = '__test__';
      window.localStorage.setItem(testKey, '1');
      window.localStorage.removeItem(testKey);
      return true;
    } catch(err){
      return false;
    }
  })();

  if(!storageAvailable){
    storageNotice.textContent = 'Penyimpanan browser tidak tersedia — catatan hanya bertahan selama tab ini terbuka.';
    storageNotice.classList.add('warn');
  }

  function escapeHtml(str){
    var d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function render(){
    if(notes.length === 0){
      listEl.innerHTML = '<div class="empty">Belum ada catatan.</div>';
      return;
    }
    listEl.innerHTML = notes.map(function(n, i){
      return '<div class="note">' +
        '<time>' + n.time + '</time>' +
        '<p>' + escapeHtml(n.text) + '</p>' +
        '<button class="del" data-i="' + i + '">[x]</button>' +
      '</div>';
    }).join('');
  }

  function loadNotes(){
    if(!storageAvailable){ render(); return; }
    try{
      var raw = window.localStorage.getItem(STORAGE_KEY);
      notes = raw ? JSON.parse(raw) : [];
    } catch(err){
      notes = [];
    }
    render();
  }

  function saveNotes(){
    if(!storageAvailable) return;
    try{
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
    } catch(err){
      storageNotice.textContent = 'Gagal menyimpan catatan. Perubahan mungkin tidak tersimpan.';
      storageNotice.classList.add('warn');
    }
  }

  addBtn.addEventListener('click', function(){
    var val = input.value.trim();
    if(!val) return;
    var now = new Date();
    var pad = function(n){ return String(n).padStart(2,'0'); };
    notes.unshift({
      text: val,
      time: pad(now.getHours()) + ':' + pad(now.getMinutes()) + ' · ' + pad(now.getDate()) + '/' + pad(now.getMonth()+1)
    });
    input.value = '';
    render();
    saveNotes();
  });

  listEl.addEventListener('click', function(e){
    if(e.target.classList.contains('del')){
      notes.splice(parseInt(e.target.getAttribute('data-i'),10), 1);
      render();
      saveNotes();
    }
  });

  loadNotes();
})();
</script>
<script src="player.js"></script>
<script>document.addEventListener("DOMContentLoaded", function(){ if(window.NanzzPlayer) window.NanzzPlayer.mount(); });</script>
</body>
</html>
