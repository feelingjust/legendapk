<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generator Sandi — NANZZ_HUB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B0D10; --surface:#14181C; --surface-2:#1B2126;
    --line-soft: rgba(231,233,228,0.08);
    --text:#E7E9E4; --text-dim:#7C848B; --accent:#E8A33D;
    --danger:#E8683D;
    --mono:'JetBrains Mono', monospace;
  }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; -khtml-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; }
  body{
    background:var(--ink); color:var(--text); font-family:var(--mono); min-height:100vh;
    background-image:linear-gradient(var(--line-soft) 1px, transparent 1px), linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
    background-size:36px 36px;
  }
  a{ color:inherit; text-decoration:none; }
  .wrap{ max-width:640px; margin:0 auto; padding:2.4rem 1.4rem 4rem; }
  .back{ font-size:.75rem; color:var(--text-dim); display:inline-flex; align-items:center; gap:.4rem; }
  .back svg{ width:13px; height:13px; }
  .back:hover{ color:var(--accent); }
  .reveal{ opacity:0; transform:translateY(12px); transition:opacity .5s ease, transform .5s ease; }
  .reveal.is-in{ opacity:1; transform:translateY(0); }

  header{ margin:1.6rem 0 2.2rem; }
  .crumb{ font-size:.7rem; color:var(--accent); letter-spacing:.05em; margin-bottom:.5rem; }
  h1{ font-size:1.9rem; font-weight:700; }
  header p{ margin-top:.5rem; color:var(--text-dim); font-size:.82rem; }

  .panel{ background:var(--surface); border:1px solid var(--line-soft); padding:1.4rem; }

  .output{
    display:flex; align-items:center; justify-content:space-between; gap:.8rem;
    background:var(--surface-2); border:1px solid var(--line-soft);
    padding:1rem 1.1rem; font-size:1.05rem; letter-spacing:.03em;
    word-break:break-all;
  }
  .output span{ flex-grow:1; }
  .copy{
    flex-shrink:0; border:1px solid var(--line-soft); background:none; color:var(--text-dim);
    font-family:var(--mono); font-size:.68rem; padding:.4rem .6rem; cursor:pointer;
  }
  .copy:hover{ color:var(--accent); border-color:var(--accent); }

  .strength{ height:4px; background:var(--surface-2); margin-top:.8rem; overflow:hidden; }
  .strength i{ display:block; height:100%; width:0%; background:var(--accent); transition:width .3s ease, background .3s ease; }
  .strength-label{ margin-top:.4rem; font-size:.68rem; color:var(--text-dim); }

  .controls{ margin-top:1.8rem; display:flex; flex-direction:column; gap:1.2rem; }
  .field-row{ display:flex; justify-content:space-between; align-items:center; font-size:.82rem; }
  input[type=range]{ width:100%; accent-color:var(--accent); }
  .len-val{ color:var(--accent); font-weight:700; }

  .checks{ display:grid; grid-template-columns:1fr 1fr; gap:.7rem; }
  label.opt{
    display:flex; align-items:center; gap:.6rem; font-size:.82rem; color:var(--text-dim);
    cursor:pointer;
  }
  label.opt input{ accent-color:var(--accent); width:15px; height:15px; }

  .row{ display:flex; justify-content:flex-end; margin-top:1.6rem; }
  .btn{
    border:1px solid var(--accent); color:var(--accent); background:transparent;
    font-family:var(--mono); font-size:.75rem; font-weight:700; letter-spacing:.03em;
    padding:.6rem 1.1rem; cursor:pointer; transition:.2s;
  }
  .btn:hover{ background:var(--accent); color:var(--ink); }

  .notice{ margin-top:1.2rem; font-size:.68rem; color:var(--text-dim); }
</style>
</head>
<body>
<div class="wrap">
  <a href="../" class="back reveal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>Kembali</a>

  <header class="reveal">
    <div class="crumb">MODUL [ 02 ]</div>
    <h1>GENERATOR SANDI</h1>
    <p>Buat kata sandi acak yang kuat, langsung di perangkat kamu.</p>
  </header>

  <div class="panel reveal">
    <div class="output">
      <span id="result">••••••••••••</span>
      <button class="copy" id="copyBtn">SALIN</button>
    </div>
    <div class="strength"><i id="strengthBar"></i></div>
    <div class="strength-label" id="strengthLabel">—</div>

    <div class="controls">
      <div>
        <div class="field-row"><span>Panjang</span><span class="len-val" id="lenVal">16</span></div>
        <input type="range" id="len" min="6" max="48" value="16">
      </div>
      <div class="checks">
        <label class="opt"><input type="checkbox" id="lower" checked> Huruf kecil (a-z)</label>
        <label class="opt"><input type="checkbox" id="upper" checked> Huruf besar (A-Z)</label>
        <label class="opt"><input type="checkbox" id="numbers" checked> Angka (0-9)</label>
        <label class="opt"><input type="checkbox" id="symbols"> Simbol (!@#$%)</label>
      </div>
    </div>

    <div class="row">
      <button class="btn" id="genBtn">GENERATE</button>
    </div>
  </div>

  <p class="notice">Dibuat sepenuhnya di browser kamu — tidak dikirim atau disimpan ke mana pun.</p>
</div>

<script>
(function(){
  document.querySelectorAll('.reveal').forEach(function(el,i){
    setTimeout(function(){ el.classList.add('is-in'); }, 80 + i*70);
  });

  var lenInput = document.getElementById('len');
  var lenVal = document.getElementById('lenVal');
  var resultEl = document.getElementById('result');
  var strengthBar = document.getElementById('strengthBar');
  var strengthLabel = document.getElementById('strengthLabel');

  var sets = {
    lower: 'abcdefghijklmnopqrstuvwxyz',
    upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
    numbers: '0123456789',
    symbols: '!@#$%^&*()-_=+[]{}'
  };

  function generate(){
    var length = parseInt(lenInput.value, 10);
    var pool = '';
    ['lower','upper','numbers','symbols'].forEach(function(key){
      if(document.getElementById(key).checked) pool += sets[key];
    });
    if(!pool){ resultEl.textContent = 'Pilih minimal satu jenis karakter'; updateStrength(0); return; }

    var arr = new Uint32Array(length);
    window.crypto.getRandomValues(arr);
    var out = '';
    for(var i=0; i<length; i++){
      out += pool[arr[i] % pool.length];
    }
    resultEl.textContent = out;
    updateStrength(scoreOf(length, pool.length));
  }

  function scoreOf(length, poolSize){
    var bits = length * Math.log2(poolSize || 1);
    if(bits < 40) return 1;
    if(bits < 70) return 2;
    if(bits < 100) return 3;
    return 4;
  }

  function updateStrength(score){
    var pct = [0, 25, 55, 80, 100][score];
    var labels = ['—', 'Lemah', 'Cukup', 'Kuat', 'Sangat kuat'];
    var colors = ['#7C848B', '#E8683D', '#E8A33D', '#8FE83D', '#3DE8A3'];
    strengthBar.style.width = pct + '%';
    strengthBar.style.background = colors[score];
    strengthLabel.textContent = labels[score];
  }

  lenInput.addEventListener('input', function(){
    lenVal.textContent = lenInput.value;
    generate();
  });
  document.querySelectorAll('.checks input').forEach(function(cb){
    cb.addEventListener('change', generate);
  });
  document.getElementById('genBtn').addEventListener('click', generate);

  document.getElementById('copyBtn').addEventListener('click', function(){
    var text = resultEl.textContent;
    navigator.clipboard.writeText(text).then(function(){
      var btn = document.getElementById('copyBtn');
      var old = btn.textContent;
      btn.textContent = 'TERSALIN';
      setTimeout(function(){ btn.textContent = old; }, 1200);
    });
  });

  generate();
})();
</script>
<script src="player.js"></script>
<script>document.addEventListener("DOMContentLoaded", function(){ if(window.NanzzPlayer) window.NanzzPlayer.mount(); });</script>
</body>
</html>
