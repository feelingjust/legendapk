<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalkulator — NANZZ_HUB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B0D10; --surface:#14181C; --surface-2:#1B2126;
    --line-soft: rgba(231,233,228,0.08);
    --text:#E7E9E4; --text-dim:#7C848B; --accent:#E8A33D;
    --mono:'JetBrains Mono', monospace;
  }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; -khtml-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; }
  body{
    background:var(--ink); color:var(--text); font-family:var(--mono); min-height:100vh;
    background-image:linear-gradient(var(--line-soft) 1px, transparent 1px), linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
    background-size:36px 36px;
  }
  a{ color:inherit; text-decoration:none; }
  .wrap{ max-width:400px; margin:0 auto; padding:2.4rem 1.4rem 4rem; }
  .back{ font-size:.75rem; color:var(--text-dim); display:inline-flex; align-items:center; gap:.4rem; }
  .back svg{ width:13px; height:13px; }
  .back:hover{ color:var(--accent); }
  .reveal{ opacity:0; transform:translateY(12px); transition:opacity .5s ease, transform .5s ease; }
  .reveal.is-in{ opacity:1; transform:translateY(0); }

  header{ margin:1.6rem 0 2.2rem; }
  .crumb{ font-size:.7rem; color:var(--accent); letter-spacing:.05em; margin-bottom:.5rem; }
  h1{ font-size:1.9rem; font-weight:700; }
  header p{ margin-top:.5rem; color:var(--text-dim); font-size:.82rem; }

  .panel{ background:var(--surface); border:1px solid var(--line-soft); padding:1.2rem; }

  .screen{
    background:var(--surface-2); border:1px solid var(--line-soft);
    padding:1.2rem 1rem; text-align:right; margin-bottom:1rem;
  }
  .screen .prev{ font-size:.78rem; color:var(--text-dim); min-height:1.1em; }
  .screen .curr{ font-size:2rem; font-weight:700; word-break:break-all; }

  .keys{
    display:grid; grid-template-columns:repeat(4, 1fr); gap:.5rem;
  }
  .key{
    background:var(--surface-2); border:1px solid var(--line-soft); color:var(--text);
    font-family:var(--mono); font-size:1rem; padding:1rem 0; cursor:pointer;
    transition:.15s;
  }
  .key:hover{ border-color:var(--accent); color:var(--accent); }
  .key.op{ color:var(--accent); }
  .key.equals{ background:var(--accent); color:var(--ink); font-weight:700; }
  .key.equals:hover{ opacity:.85; border-color:var(--accent); color:var(--ink); }
  .key.wide{ grid-column:span 2; }

  .notice{ margin-top:1.2rem; font-size:.68rem; color:var(--text-dim); }
</style>
</head>
<body>
<div class="wrap">
  <a href="../" class="back reveal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>Kembali</a>

  <header class="reveal">
    <div class="crumb">MODUL [ 06 ]</div>
    <h1>KALKULATOR</h1>
    <p>Kalkulator standar untuk hitungan cepat.</p>
  </header>

  <div class="panel reveal">
    <div class="screen">
      <div class="prev" id="prev">&nbsp;</div>
      <div class="curr" id="curr">0</div>
    </div>

    <div class="keys">
      <button class="key" data-action="clear">AC</button>
      <button class="key" data-action="sign">+/-</button>
      <button class="key" data-action="percent">%</button>
      <button class="key op" data-action="divide">÷</button>

      <button class="key" data-num="7">7</button>
      <button class="key" data-num="8">8</button>
      <button class="key" data-num="9">9</button>
      <button class="key op" data-action="multiply">×</button>

      <button class="key" data-num="4">4</button>
      <button class="key" data-num="5">5</button>
      <button class="key" data-num="6">6</button>
      <button class="key op" data-action="subtract">−</button>

      <button class="key" data-num="1">1</button>
      <button class="key" data-num="2">2</button>
      <button class="key" data-num="3">3</button>
      <button class="key op" data-action="add">+</button>

      <button class="key wide" data-num="0">0</button>
      <button class="key" data-action="dot">.</button>
      <button class="key equals" data-action="equals">=</button>
    </div>
  </div>

  <p class="notice">Berjalan sepenuhnya di browser kamu.</p>
</div>

<script>
(function(){
  document.querySelectorAll('.reveal').forEach(function(el,i){
    setTimeout(function(){ el.classList.add('is-in'); }, 80 + i*70);
  });

  var currEl = document.getElementById('curr');
  var prevEl = document.getElementById('prev');

  var current = '0';
  var previous = null;
  var operator = null;
  var justEvaluated = false;

  function updateScreen(){
    currEl.textContent = current;
    prevEl.textContent = previous !== null && operator ? previous + ' ' + operator : '\u00A0';
  }

  function inputNum(n){
    if(justEvaluated){ current = '0'; justEvaluated = false; }
    if(current === '0' && n !== '.') current = n;
    else if(n === '.' && current.includes('.')) return;
    else current += n;
    updateScreen();
  }

  function compute(a, b, op){
    a = parseFloat(a); b = parseFloat(b);
    switch(op){
      case '+': return a + b;
      case '−': return a - b;
      case '×': return a * b;
      case '÷': return b === 0 ? 'Error' : a / b;
    }
  }

  function setOperator(op){
    if(operator && previous !== null && !justEvaluated){
      previous = compute(previous, current, operator);
      current = String(previous);
    } else {
      previous = current;
    }
    operator = op;
    justEvaluated = false;
    current = '0';
    updateScreen();
  }

  function equals(){
    if(operator === null || previous === null) return;
    var result = compute(previous, current, operator);
    current = String(result);
    previous = null;
    operator = null;
    justEvaluated = true;
    updateScreen();
  }

  document.querySelectorAll('.key').forEach(function(key){
    key.addEventListener('click', function(){
      var num = key.getAttribute('data-num');
      var action = key.getAttribute('data-action');

      if(num !== null){ inputNum(num); return; }

      switch(action){
        case 'clear': current='0'; previous=null; operator=null; justEvaluated=false; updateScreen(); break;
        case 'sign': current = String(parseFloat(current) * -1); updateScreen(); break;
        case 'percent': current = String(parseFloat(current) / 100); updateScreen(); break;
        case 'dot': inputNum('.'); break;
        case 'add': setOperator('+'); break;
        case 'subtract': setOperator('−'); break;
        case 'multiply': setOperator('×'); break;
        case 'divide': setOperator('÷'); break;
        case 'equals': equals(); break;
      }
    });
  });

  updateScreen();
})();
</script>
<script src="player.js"></script>
<script>document.addEventListener("DOMContentLoaded", function(){ if(window.NanzzPlayer) window.NanzzPlayer.mount(); });</script>
</body>
</html>
