<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kode QR — NANZZ_HUB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --ink:#0B0D10; --surface:#14181C; --surface-2:#1B2126;
    --line-soft: rgba(231,233,228,0.08);
    --text:#E7E9E4; --text-dim:#7C848B; --accent:#E8A33D;
    --mono:'JetBrains Mono', monospace;
  }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; -khtml-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; }
  body{
    background:var(--ink); color:var(--text); font-family:var(--mono); min-height:100vh;
    background-image:linear-gradient(var(--line-soft) 1px, transparent 1px), linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
    background-size:36px 36px;
  }
  a{ color:inherit; text-decoration:none; }
  .wrap{ max-width:560px; margin:0 auto; padding:2.4rem 1.4rem 4rem; }
  .back{ font-size:.75rem; color:var(--text-dim); display:inline-flex; align-items:center; gap:.4rem; }
  .back svg{ width:13px; height:13px; }
  .back:hover{ color:var(--accent); }
  .reveal{ opacity:0; transform:translateY(12px); transition:opacity .5s ease, transform .5s ease; }
  .reveal.is-in{ opacity:1; transform:translateY(0); }

  header{ margin:1.6rem 0 2.2rem; }
  .crumb{ font-size:.7rem; color:var(--accent); letter-spacing:.05em; margin-bottom:.5rem; }
  h1{ font-size:1.9rem; font-weight:700; }
  header p{ margin-top:.5rem; color:var(--text-dim); font-size:.82rem; }

  .panel{ background:var(--surface); border:1px solid var(--line-soft); padding:1.4rem; }

  input[type=text]{
    width:100%; background:var(--surface-2); border:1px solid var(--line-soft); color:var(--text);
    font-family:var(--mono); font-size:.88rem; padding:.75rem .9rem; outline:none;
  }
  input[type=text]:focus{ border-color:var(--accent); }

  .row{ display:flex; justify-content:flex-end; margin-top:.9rem; gap:.6rem; }
  .btn{
    border:1px solid var(--accent); color:var(--accent); background:transparent;
    font-family:var(--mono); font-size:.75rem; font-weight:700; letter-spacing:.03em;
    padding:.6rem 1rem; cursor:pointer; transition:.2s;
  }
  .btn:hover{ background:var(--accent); color:var(--ink); }
  .btn[disabled]{ opacity:.4; cursor:not-allowed; }
  .btn[disabled]:hover{ background:none; color:var(--accent); }

  .qr-area{
    margin-top:1.8rem; display:flex; flex-direction:column; align-items:center; gap:1rem;
  }
  #qrcode{
    background:#fff; padding:16px; display:none;
  }
  .empty{ color:var(--text-dim); font-size:.8rem; text-align:center; padding:2rem 0; }

  .notice{ margin-top:1.2rem; font-size:.68rem; color:var(--text-dim); }
</style>
</head>
<body>
<div class="wrap">
  <a href="../" class="back reveal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>Kembali</a>

  <header class="reveal">
    <div class="crumb">MODUL [ 03 ]</div>
    <h1>KODE QR</h1>
    <p>Ubah teks atau tautan menjadi kode QR yang bisa diunduh.</p>
  </header>

  <div class="panel reveal">
    <input type="text" id="input" placeholder="Tempel tautan atau tulis teks di sini...">
    <div class="row">
      <button class="btn" id="downloadBtn" disabled>UNDUH PNG</button>
      <button class="btn" id="genBtn">BUAT KODE QR</button>
    </div>

    <div class="qr-area">
      <div id="qrcode"></div>
      <div class="empty" id="emptyMsg">Kode QR akan muncul di sini.</div>
    </div>
  </div>

  <p class="notice">Dibuat langsung di browser kamu — teks tidak dikirim ke server mana pun.</p>
</div>

<script>
(function(){
  document.querySelectorAll('.reveal').forEach(function(el,i){
    setTimeout(function(){ el.classList.add('is-in'); }, 80 + i*70);
  });

  var input = document.getElementById('input');
  var qrEl = document.getElementById('qrcode');
  var emptyMsg = document.getElementById('emptyMsg');
  var downloadBtn = document.getElementById('downloadBtn');
  var qr = null;

  function generate(){
    var val = input.value.trim();
    if(!val) return;

    qrEl.innerHTML = '';
    qr = new QRCode(qrEl, {
      text: val,
      width: 220,
      height: 220,
      colorDark: '#0B0D10',
      colorLight: '#ffffff'
    });
    qrEl.style.display = 'inline-block';
    emptyMsg.style.display = 'none';
    downloadBtn.removeAttribute('disabled');
  }

  document.getElementById('genBtn').addEventListener('click', generate);
  input.addEventListener('keydown', function(e){
    if(e.key === 'Enter') generate();
  });

  downloadBtn.addEventListener('click', function(){
    var canvas = qrEl.querySelector('canvas');
    if(!canvas) return;
    var link = document.createElement('a');
    link.download = 'kode-qr.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });
})();
</script>
<script src="player.js"></script>
<script>document.addEventListener("DOMContentLoaded", function(){ if(window.NanzzPlayer) window.NanzzPlayer.mount(); });</script>
</body>
</html>
