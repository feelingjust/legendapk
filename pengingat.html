<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pengingat — NANZZ_HUB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B0D10; --surface:#14181C; --surface-2:#1B2126;
    --line-soft: rgba(231,233,228,0.08);
    --text:#E7E9E4; --text-dim:#7C848B; --accent:#E8A33D;
    --mono:'JetBrains Mono', monospace;
  }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; -khtml-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; }
  body{
    background:var(--ink); color:var(--text); font-family:var(--mono); min-height:100vh;
    background-image:linear-gradient(var(--line-soft) 1px, transparent 1px), linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
    background-size:36px 36px;
  }
  a{ color:inherit; text-decoration:none; }
  .wrap{ max-width:680px; margin:0 auto; padding:2.4rem 1.4rem 4rem; }
  .back{ font-size:.75rem; color:var(--text-dim); display:inline-flex; align-items:center; gap:.4rem; }
  .back svg{ width:13px; height:13px; }
  .back:hover{ color:var(--accent); }
  .reveal{ opacity:0; transform:translateY(12px); transition:opacity .5s ease, transform .5s ease; }
  .reveal.is-in{ opacity:1; transform:translateY(0); }

  header{ margin:1.6rem 0 2.2rem; }
  .crumb{ font-size:.7rem; color:var(--accent); letter-spacing:.05em; margin-bottom:.5rem; }
  h1{ font-size:1.9rem; font-weight:700; }
  header p{ margin-top:.5rem; color:var(--text-dim); font-size:.82rem; }

  .panel{ background:var(--surface); border:1px solid var(--line-soft); padding:1.4rem; }

  .addrow{ display:flex; gap:.6rem; }
  input[type=text]{
    flex-grow:1; background:var(--surface-2); border:1px solid var(--line-soft); color:var(--text);
    font-family:var(--mono); font-size:.86rem; padding:.7rem .85rem; outline:none;
  }
  input[type=date]{
    background:var(--surface-2); border:1px solid var(--line-soft); color:var(--text);
    font-family:var(--mono); font-size:.8rem; padding:.7rem .6rem; outline:none;
  }
  input:focus{ border-color:var(--accent); }

  .btn{
    border:1px solid var(--accent); color:var(--accent); background:transparent;
    font-family:var(--mono); font-size:.75rem; font-weight:700; letter-spacing:.03em;
    padding:.55rem .9rem; cursor:pointer; transition:.2s; flex-shrink:0;
  }
  .btn:hover{ background:var(--accent); color:var(--ink); }

  .filters{ display:flex; gap:.5rem; margin:1.4rem 0 1rem; }
  .filter{
    font-size:.7rem; color:var(--text-dim); border:1px solid var(--line-soft);
    padding:.4rem .8rem; cursor:pointer;
  }
  .filter.active{ color:var(--accent); border-color:var(--accent); }

  .list{ display:flex; flex-direction:column; gap:.6rem; }
  .task{
    display:flex; align-items:flex-start; gap:.8rem;
    background:var(--surface-2); border:1px solid var(--line-soft);
    padding:.85rem 1rem;
  }
  .task input[type=checkbox]{ accent-color:var(--accent); width:16px; height:16px; margin-top:.15rem; flex-shrink:0; }
  .task .body{ flex-grow:1; }
  .task .text{ font-size:.86rem; }
  .task.done .text{ text-decoration:line-through; color:var(--text-dim); }
  .task .due{ font-size:.68rem; color:var(--text-dim); margin-top:.25rem; }
  .task .del{
    background:none; border:none; color:var(--text-dim); cursor:pointer; font-family:var(--mono); font-size:.8rem;
  }
  .task .del:hover{ color:var(--accent); }

  .empty{ color:var(--text-dim); font-size:.8rem; text-align:center; padding:2rem 0; }
  .notice{ margin-top:1.2rem; font-size:.68rem; color:var(--text-dim); }

  @media (max-width:520px){
    .addrow{ flex-wrap:wrap; }
  }
</style>
</head>
<body>
<div class="wrap">
  <a href="index.html" class="back reveal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>Kembali</a>

  <header class="reveal">
    <div class="crumb">MODUL [ 05 ]</div>
    <h1>PENGINGAT</h1>
    <p>Catat tugas, beri tenggat waktu, dan tandai selesai.</p>
  </header>

  <div class="panel reveal">
    <div class="addrow">
      <input type="text" id="taskInput" placeholder="Tugas baru...">
      <input type="date" id="dueInput">
      <button class="btn" id="addBtn">TAMBAH</button>
    </div>

    <div class="filters">
      <div class="filter active" data-f="semua">SEMUA</div>
      <div class="filter" data-f="aktif">AKTIF</div>
      <div class="filter" data-f="selesai">SELESAI</div>
    </div>

    <div class="list" id="list"></div>
  </div>

  <p class="notice">Daftar tugas disimpan sementara di memori halaman ini dan akan hilang saat dimuat ulang.</p>
</div>

<script>
(function(){
  document.querySelectorAll('.reveal').forEach(function(el,i){
    setTimeout(function(){ el.classList.add('is-in'); }, 80 + i*70);
  });

  var tasks = [];
  var filter = 'semua';
  var listEl = document.getElementById('list');
  var taskInput = document.getElementById('taskInput');
  var dueInput = document.getElementById('dueInput');

  function escapeHtml(str){
    var d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function render(){
    var filtered = tasks.filter(function(t){
      if(filter === 'aktif') return !t.done;
      if(filter === 'selesai') return t.done;
      return true;
    });

    if(filtered.length === 0){
      listEl.innerHTML = '<div class="empty">Tidak ada tugas di sini.</div>';
      return;
    }

    listEl.innerHTML = filtered.map(function(t){
      var idx = tasks.indexOf(t);
      return '<div class="task ' + (t.done ? 'done' : '') + '">' +
        '<input type="checkbox" data-i="' + idx + '" ' + (t.done ? 'checked' : '') + '>' +
        '<div class="body">' +
          '<div class="text">' + escapeHtml(t.text) + '</div>' +
          (t.due ? '<div class="due">Tenggat: ' + t.due + '</div>' : '') +
        '</div>' +
        '<button class="del" data-i="' + idx + '">[x]</button>' +
      '</div>';
    }).join('');
  }

  document.getElementById('addBtn').addEventListener('click', function(){
    var val = taskInput.value.trim();
    if(!val) return;
    tasks.unshift({ text: val, due: dueInput.value, done: false });
    taskInput.value = '';
    dueInput.value = '';
    render();
  });

  taskInput.addEventListener('keydown', function(e){
    if(e.key === 'Enter') document.getElementById('addBtn').click();
  });

  listEl.addEventListener('click', function(e){
    if(e.target.matches('input[type=checkbox]')){
      tasks[parseInt(e.target.getAttribute('data-i'),10)].done = e.target.checked;
      render();
    }
    if(e.target.classList.contains('del')){
      tasks.splice(parseInt(e.target.getAttribute('data-i'),10), 1);
      render();
    }
  });

  document.querySelectorAll('.filter').forEach(function(f){
    f.addEventListener('click', function(){
      document.querySelectorAll('.filter').forEach(function(x){ x.classList.remove('active'); });
      f.classList.add('active');
      filter = f.getAttribute('data-f');
      render();
    });
  });

  render();
})();
</script>
<script src="player.js"></script>
<script>document.addEventListener("DOMContentLoaded", function(){ if(window.NanzzPlayer) window.NanzzPlayer.mount(); });</script>
</body>
</html>
